# 复制此文件为 config.yaml，填入真实 API key 后使用
# cp config.example.yaml config.yaml
#
# 也可放到 ~/.rhinecode/config.yaml 作为全局默认：这样在任意目录直接敲 `rhine` 都会读到，
# 无需每次带 --config（首次运行 rhine 时若该文件不存在，会自动生成同款模板）。

# 后端协议。本项目只支持 DeepSeek——anthropic / openai 两个 Provider
# 已于 2026-08-20 删除（它们一直停留在纯对话能力，工具调用 / Plan Mode /
# 权限系统 / Skill / 子 Agent 全都只在 deepseek 下可用）。
# 老配置里若还写着那两个值，启动时会明确报错并给出改法。
protocol: deepseek
model: deepseek-chat
base_url: https://api.deepseek.com
api_key: YOUR_API_KEY

# 可选：上下文窗口上限（token），c8 两层压缩据此判断历史是否逼近溢出。
# 缺省 65536；不同模型/账号窗口不同，可按需调整。非法或 <=0 会回退默认值。
# context_window: 65536
