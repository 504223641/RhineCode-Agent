[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rhinecode"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    # c7：MCP 客户端的 Streamable HTTP 传输需要流式读取 SSE（text/event-stream），
    # httpx 的 stream()/iter_lines() 支持得干净；openai 已传递依赖 httpx，此处显式声明。
    "httpx>=0.27",
]

[project.scripts]
# 安装后暴露的全局命令名。包名/源码目录仍是 rhinecode，这里只改对外命令为 rhine，
# 让用户在任意目录直接敲 `rhine` 启动（`python -m rhinecode` 不依赖此项，仍可用）。
rhine = "rhinecode.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rhinecode*"]

# c11：把内置 Skill 样板打进分发包。
# packages.find 只收集 .py，`.md` 不会自动进 wheel——不加这段的话
# `pip install -e .`（开发模式直接读源码目录）一切正常，但真正 `pip install`
# 之后 skills/builtin/ 会是空的，三个内置样板凭空消失，而且不报任何错。
[tool.setuptools.package-data]
"rhinecode.skills" = ["builtin/*.md"]
