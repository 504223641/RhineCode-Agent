[build-system]
# ⚠ 下限 77 是 PEP 639 的要求，不是随手写的：[project] 里的 `license = "MIT"`
# （SPDX 表达式）与 `license-files` 两个字段从 setuptools 77 才被支持——
# 更老的版本会把 license 当成「许可证正文」（已废弃写法），并对 license-files
# 报「未知字段」而直接构建失败。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rhinecode"
# ⚠ **这是版本号的唯一事实源。** `rhinecode/__init__.py` 的 `__version__` 走
# importlib.metadata 从这里读，`mcp/client.py` 自报给外部 MCP Server 的客户端
# 版本又引用那个——三处一条链，改这一行即可。此前 mcp/client.py 有一份硬编码
# 副本，与本行之间没有任何东西把它们关联起来（C9）。
version = "0.1.0"
requires-python = ">=3.11"

# C9 包元数据。在此之前 [project] 里只有 name/version/requires-python/license，
# 于是 `pip show rhinecode` 与 PyPI 页面上**没有一句话说明这是什么**——
# 对一个要开源、要当作品集展示的项目，那是最先被看到也最容易补的一处。
description = "终端 AI 编程助手：用 Python + Textual 实现，交互体验参考 Claude Code"
readme = "README.md"
authors = [{ name = "Jinbiao Wang" }]
keywords = ["ai", "agent", "cli", "tui", "textual", "coding-assistant", "deepseek"]
# 分类器只写**经得起核对**的几条，不堆砌。
# ⚠ 「Programming Language :: Python :: 3.x」要与 requires-python 一致：
# 多写一个没测过的版本等于一句没有依据的兼容性承诺，而 CI 的六格矩阵
# （windows/ubuntu × 3.11/3.12/3.13）恰好是这三行的依据。
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

# 许可证（A1）。选型结论见 docs/review/01-release-blockers.md 的 R5-10：
# 依赖全是宽松许可证、不构成任何约束，MIT 在「被读、被用、被记住」三件事上
# 摩擦最小，且先选 MIT 是可逆的那一步（将来换 Apache-2.0 成本很低，反过来难）。
#
# ⚠ 两行缺一不可：`license` 只是元数据里的一个字符串，**不会把 LICENSE 全文
# 打进分发包**。没有 license-files 时 sdist / wheel 里一个 LICENSE 都没有
# （已实测），也就是说装到用户机器上的那份包在法律上是「无许可证」的。
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # A2 / R5-3：下界 **6.2.1 是实跑二分出来的，不是按 API 引入版本推的**。
    # 推法只会得到 2.0.0（`textual.style` 的引入版本），而 2.0.0 上 239 条
    # TUI 用例错 25 条。真正卡住下界的不是 API 而是一个功能 bug：
    # textual 6.2.1 才修掉「焦点在 Input 上时选不到别处的文本」，
    # 而本项目的主输入框**一直是焦点**——低于 6.2.1 装得上、跑得起来、
    # 界面正常，**只有 `Ctrl+C` 复制这一件事默默复制不全**。
    # 6.2.1 是实测全量 3323 条全绿的最低版本（6.2.0 上失败 5 条，全在
    # tests/test_tui_selection.py）。逐版本实测表见
    # docs/review/01-release-blockers.md 的 R5-3。
    #
    # ⚠ 上界 `<9` 是**防御性的，不是保证**：本项目最脆弱的依赖面就是
    # `textual.content` / `textual.style` 这两个 import（在 0.89 与 2.0 两处
    # 都断过），`<9` 挡的是「下一个大版本一上来就改掉它们的形状」。
    # 而 6.2.0 → 6.2.1 那次证明了**破坏性变化可以发生在 patch 位**，
    # 上界对那种情况无能为力——真正的兜底是 CI（.github/workflows/ci.yml）。
    "textual>=6.2.1,<9",

    # C2：rich 必须**显式声明**，不能靠 textual 的传递依赖。
    # rhinecode/tui/widgets.py:23-29 直接 import 了 7 个 rich 模块
    # （cell_len / Group / Highlighter / Markdown / Segment / Style / Text）——
    # 「直接 import 就要直接声明」是打包的基本纪律。现在不会崩（textual 8.2.8 的
    # Requires 里有 rich），但 textual 一直在减少对 rich 的依赖（Content / Span
    # 这些自有类型已经在替代它），哪天它不再依赖 rich，我们这边就是一个
    # 装得上、一启动界面就 ImportError 的包。
    #
    # ⚠ 这一条**刻意不加上界**，与下面三条不同：rich 实际是由 textual 带进来的，
    # 版本由 textual 的 requires 决定。我们在这里再压一个独立上界，一旦将来
    # textual 要求的 rich 越过它，pip 会解析失败——那是我们自己造出来的冲突，
    # 而不是真实的不兼容。上界的活交给 `textual<9` 那一条去做。
    "rich>=13",
    # ⚠ openai SDK 是 DeepSeek Provider 的依赖，不是「OpenAI Provider」的——
    # 后者已于 2026-08-20 删除，而 DeepSeek 走的正是 OpenAI 兼容协议，
    # 这一行**不能跟着一起删**。anthropic SDK 随那次删除一并移除。
    #
    # ⚠ 上界 `<4` 的由来（R5-4）：此前无上界，于是**开发机装的是 1.109.1、
    # 干净 venv 装出来的是 3.6.0**——中间隔了两个大版本，而 DeepSeek Provider
    # 的全部能力都建立在这个 SDK 上，这条漂移从未被验过。实测（起一个最小的
    # OpenAI 兼容 SSE 服务器，对比两个版本下 `stream_chat` 的逐块输出）
    # **两者行为等价**，唯一差别是 3.x 的 CompletionUsage 多一个 compute_units
    # 字段，而全项目读 usage 都是按名字取属性，不受影响。
    # 因此取 `<4` 而不是 `<2`：`<2` 会把已经实测能跑的 3.x 挡在门外。
    "openai>=1.50.0,<4",
    # 上界 `<7`：pyyaml 长期停在 6.x，`yaml.safe_load` / `safe_dump` 这套 API
    # 极稳定，加上界纯属防御——真到了 7.0 该由 CI 先撞上，而不是由用户撞上。
    "pyyaml>=6.0,<7",
    # c7：MCP 客户端的 Streamable HTTP 传输需要流式读取 SSE（text/event-stream），
    # httpx 的 stream()/iter_lines() 支持得干净；openai 已传递依赖 httpx，此处显式声明。
    #
    # ⚠ 上界取 `<1` 而不是更紧的 `<0.29`，理由是**与 openai 自己的约束对齐**：
    # openai SDK 声明的就是 `httpx>=0.23,<1`。写更紧的值不会带来更多安全性
    # （0.x 的破坏性变化落在 minor 位，`<0.29` 同样挡不住 0.28 内部的变化），
    # 却会在 openai 升级到某个新 0.x 时先一步把安装拧死。
    "httpx>=0.27,<1",
]

# C9：仓库地址。`pip show` 与 PyPI 页面上的「Homepage」就是从这里来的——
# 没有它，装了包的人**没有任何办法找回项目主页**去看文档或提 issue。
[project.urls]
Homepage = "https://github.com/504223641/RhineCode-Agent"
Repository = "https://github.com/504223641/RhineCode-Agent"
Issues = "https://github.com/504223641/RhineCode-Agent/issues"

[project.scripts]
# 安装后暴露的全局命令名。包名/源码目录仍是 rhinecode，这里只改对外命令为 rhine，
# 让用户在任意目录直接敲 `rhine` 启动（`python -m rhinecode` 不依赖此项，仍可用）。
rhine = "rhinecode.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rhinecode*"]

# 把内置 Skill 样板打进分发包。
#
# ⚠️ 这段是**冗余保险，不是必需品**——原注释（c11 时写的）声称「不加这段的话
# 真正 pip install 之后 skills/builtin/ 会是空的」，作者期扩展做实测时发现
# **那句话不成立**：本项目用纯 pyproject.toml 配置，而 setuptools>=61 在这种
# 配置下 `include-package-data` **默认为真**，包目录内的非 .py 文件本来就会
# 一并打包。
#
# 实测三组（每组都先 `rm -rf build`，否则 setuptools 会复用 build/lib/ 里
# 上一次的产物，验的其实是上一次的配置——第一次就是这么得到假结论的）：
#
#   | 配置                                        | .md 进包吗 |
#   |---------------------------------------------|-----------|
#   | 有本段（两条模式）                           | 全部进    |
#   | 有本段（仅 builtin/*.md，旧写法）            | 全部进    |
#   | 整段删掉                                     | 全部进    |
#   | 整段删掉 + include-package-data = false      | **一个都没有** |
#
# 最后一行才是真正的开关。保留本段的理由只有一条：**万一将来有人关掉
# include-package-data，这里仍然兜得住**。因此它必须写全——
# `*` 不跨目录分隔符，第一条只覆盖单文件型（builtin/commit.md），
# 第二条才覆盖目录型（builtin/skill-creator/SKILL.md 与它的随附资源）。
#
# 不用 `**` 递归通配：它对 setuptools 版本有要求，而内置样板不会嵌套超过两层
# （一个 Skill 一个目录，就到底了），两条显式模式在所有版本上都成立。
[tool.setuptools.package-data]
"rhinecode.skills" = ["builtin/*.md", "builtin/*/*.md"]
# ⚠ A5：这一行此前**是漏的**，后果是 C13 的「定义式委派」在任何
# `pip install .`（注意不是 `-e`）出来的副本里整个失效——wheel 与 sdist 里
# `rhinecode/subagents/builtin/` 一个文件都没有，explorer / planner /
# general-purpose 三个内置角色全丢。而它**完全静默**：分层扫描对缺失的层
# 是设计上的静默跳过（那个容错本是为「用户没建 .rhinecode/agents/」写的），
# 于是结果是「0 个角色、0 个错误」；无角色时 render_agent_index 又刻意返回
# 空串，系统提示里那一段整个消失。全链路上唯一会说出真相的，是模型猜错
# 角色名时的回灌文案。完整论证见 docs/review/01-release-blockers.md 的 R5-1。
#
# ⚠ 它与上面 skills 那条的**模式条数不一样是对的，不是漏写**：
# 一个角色 = 一个 md 文件、不嵌套（builtin/explorer.md），所以一条就够；
# Skill 另有目录型（builtin/skill-creator/SKILL.md），才需要第二条。
# **将来若角色也支持目录型，这里必须跟着加一条 `builtin/*/*.md`**——
# 这是一处成对维护点（`subagents/builtin/` 的目录结构 ↔ 本行的模式），
# 漏改一律不报错，护栏是 tests/test_package_data.py。
"rhinecode.subagents" = ["builtin/*.md"]
