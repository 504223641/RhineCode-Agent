[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "rhinecode"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
]

[project.scripts]
rhinecode = "rhinecode.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rhinecode*"]
